[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo_trading"
version = "0.1.0"
description = "Quantitative equity research framework — multi-signal alpha, US equities first."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nicolas Greiner" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "cvxpy>=1.5",
    "yfinance>=0.2.40",
    "simfin>=1.0",
    "vectorbt>=0.26",
    "ib_insync>=0.9.86",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "duckdb>=0.10",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "jupyterlab>=4",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "data*",
    "signals*",
    "combination*",
    "backtest*",
    "portfolio*",
    "risk*",
]
exclude = ["research*", "scripts*", "results*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
